name: Build Linux DDNet server

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 \
            zlib1g-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libpng-dev file
      - name: Build and stage
        env:
          BUILD_SERVER_SKIP_APT: '1'
        run: |
          chmod +x ./build_server.sh
          ./build_server.sh
      - name: Verify binary
        run: |
          file deploy/DDNet-Server
          ldd deploy/DDNet-Server | tee deploy/ldd.txt
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-server-linux-x86_64
          path: deploy/
          if-no-files-found: error